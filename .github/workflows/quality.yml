name: Quality Gate
on:
  push:
    branches: ["main", "dev/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (validate --strict)
        run: npm run lint

      - name: Core tests
        run: npm run test

      - name: Memory suite
        run: npm run test:memory

      - name: Doctor check
        run: npm run doctor

      - name: Quality summary
        run: npm run quality
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
